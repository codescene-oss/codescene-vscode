name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-test.[0-9a-f]+'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build, publish and promote
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: github-release
  cancel-in-progress: false
  queue: max

jobs:
  metadata:
    name: 'Resolve Release Metadata'
    runs-on: 'ubuntu-latest'
    permissions:
      contents: read
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
      EVENT: ${{ github.event_name }}
      RUN_REF: ${{ github.ref }}
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
      is_test: ${{ steps.release.outputs.is_test }}
      notes_start_tag: ${{ steps.release.outputs.notes_start_tag }}
      stable_tag: ${{ steps.release.outputs.stable_tag }}
      sha: ${{ steps.release.outputs.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Validate tag and resolve release notes range
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          if [[ "$EVENT" == "workflow_dispatch" ]]; then
            if [[ "$RUN_REF" != "refs/heads/main" ]]; then
              echo "Manual releases must be dispatched from main, got $RUN_REF." >&2
              exit 1
            fi
            if ! git rev-parse -q --verify "refs/tags/$TAG" > /dev/null; then
              echo "Tag $TAG does not exist." >&2
              exit 1
            fi
          fi

          node ./scripts/release-flow.js classify "$TAG" > /dev/null
          tagged_commit=$(git rev-parse "$TAG^{commit}")

          releases_file="${RUNNER_TEMP}/published-releases.tsv"
          gh api --paginate "repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
            --jq '.[] | select(.draft == false) | [.tag_name, .prerelease] | @tsv' \
            > "$releases_file"

          find_previous_stable() {
            while IFS=$'\t' read -r candidate prerelease; do
              if [[ "$prerelease" == "false" &&
                    "$candidate" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ &&
                    "$candidate" != "$TAG" ]] &&
                 git merge-base --is-ancestor "${candidate}^{commit}" "$tagged_commit"; then
                echo "$candidate"
                return
              fi
            done < "$releases_file"
          }

          find_previous_test() {
            local base_version="$1"
            while IFS=$'\t' read -r candidate prerelease; do
              if [[ "$prerelease" == "true" &&
                    "$candidate" =~ ^v${base_version}-test\.[0-9a-f]{7,40}$ &&
                    "$candidate" != "$TAG" ]] &&
                 git merge-base --is-ancestor "${candidate}^{commit}" "$tagged_commit"; then
                echo "$candidate"
                return
              fi
            done < "$releases_file"
          }

          current_version=$(git show "$tagged_commit:package.json" | jq -r '.version')
          version="${TAG#v}"
          is_test=false
          notes_start_tag=
          stable_tag=

          if [[ "$TAG" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)-test\.([0-9a-f]{7,40})$ ]]; then
            is_test=true
            base_version="${BASH_REMATCH[1]}"
            tag_sha="${BASH_REMATCH[2]}"
            actual_sha=$(git rev-parse --short="${#tag_sha}" "$tagged_commit")
            if [[ "$tag_sha" != "$actual_sha" ]]; then
              echo "Test tag SHA $tag_sha does not match tagged commit $actual_sha." >&2
              exit 1
            fi
            node ./scripts/release-flow.js is-next-version "$current_version" "$base_version"
            stable_tag=$(find_previous_stable)
            notes_start_tag=$(find_previous_test "$base_version")
            if [[ -z "$notes_start_tag" ]]; then
              notes_start_tag="$stable_tag"
            fi
          elif [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            if ! git merge-base --is-ancestor "$tagged_commit" origin/main; then
              echo "Stable tag $TAG must point at a commit on main." >&2
              exit 1
            fi
            notes_start_tag=$(find_previous_stable)
          else
            echo "Expected vX.Y.Z or vX.Y.Z-test.<commit-sha>, got $TAG." >&2
            exit 1
          fi

          {
            echo "tag=$TAG"
            echo "version=$version"
            echo "is_test=$is_test"
            echo "notes_start_tag=$notes_start_tag"
            echo "stable_tag=$stable_tag"
            echo "sha=$tagged_commit"
          } >> "$GITHUB_OUTPUT"

  build:
    needs: metadata
    strategy:
      matrix:
        include:
          - variant: full
            build_no_ace: false
            vsix_prefix: codescene-vscode
            platform: darwin
            arch: x64
          - variant: full
            build_no_ace: false
            vsix_prefix: codescene-vscode
            platform: darwin
            arch: arm64
          - variant: full
            build_no_ace: false
            vsix_prefix: codescene-vscode
            platform: linux
            arch: x64
          - variant: full
            build_no_ace: false
            vsix_prefix: codescene-vscode
            platform: linux
            arch: arm64
          - variant: full
            build_no_ace: false
            vsix_prefix: codescene-vscode
            platform: win32
            arch: x64
          - variant: noace
            build_no_ace: true
            vsix_prefix: codescene-vscode-noace
            platform: darwin
            arch: x64
          - variant: noace
            build_no_ace: true
            vsix_prefix: codescene-vscode-noace
            platform: darwin
            arch: arm64
          - variant: noace
            build_no_ace: true
            vsix_prefix: codescene-vscode-noace
            platform: linux
            arch: x64
          - variant: noace
            build_no_ace: true
            vsix_prefix: codescene-vscode-noace
            platform: linux
            arch: arm64
          - variant: noace
            build_no_ace: true
            vsix_prefix: codescene-vscode-noace
            platform: win32
            arch: x64
    name: 'Build ${{ matrix.variant }} ${{ matrix.platform }}-${{ matrix.arch }}'
    runs-on: 'ubuntu-latest'
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ needs.metadata.outputs.tag }}

      - uses: './.github/actions/setup'

      - name: Set release version
        env:
          VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const packageJson = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          packageJson.version = process.env.VERSION;
          fs.writeFileSync('package.json', `${JSON.stringify(packageJson, null, 2)}\n`);
          NODE

      - name: Install vsce
        run: npm install --global @vscode/vsce

      - name: Package platform-specific VSIX
        run: node ./scripts/package-platform.js ${{ matrix.platform }} ${{ matrix.arch }}
        env:
          CI: true
          BUILD_NO_ACE: ${{ matrix.build_no_ace }}
          GITHUB_TOKEN: ${{ secrets.CODESCENE_IDE_DOCS_AND_WEBVIEW_TOKEN }}

      # .cs-prod-build is expected for correct functioning of the extension, so we validate its presence:
      - name: Verify .cs-prod-build marker in VSIX
        run: |
          VSIX_FILE=$(ls ${{ matrix.vsix_prefix }}-*-${{ matrix.platform }}-${{ matrix.arch }}.vsix)
          unzip -l "$VSIX_FILE" | tee vsix-contents.txt
          if grep -q "\.cs-prod-build" vsix-contents.txt; then
            echo ".cs-prod-build marker found in VSIX"
            exit 0
          else
            echo ".cs-prod-build marker not found in VSIX!"
            exit 1
          fi

      - name: Verify version in VSIX
        env:
          EXPECTED_VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          VSIX_FILE=$(ls ${{ matrix.vsix_prefix }}-*-${{ matrix.platform }}-${{ matrix.arch }}.vsix)
          ACTUAL_VERSION=$(unzip -p "$VSIX_FILE" extension/package.json | jq -r '.version')
          if [ "$ACTUAL_VERSION" != "$EXPECTED_VERSION" ]; then
            echo "Expected VSIX version $EXPECTED_VERSION, got $ACTUAL_VERSION."
            exit 1
          fi
          echo "VSIX version $ACTUAL_VERSION verified."

      - name: Verify no-ACE settings absent from VSIX
        if: matrix.variant == 'noace'
        run: |
          VSIX_FILE=$(ls ${{ matrix.vsix_prefix }}-*-${{ matrix.platform }}-${{ matrix.arch }}.vsix)
          unzip -p "$VSIX_FILE" extension/package.json > vsix-package.json
          if jq -e '.contributes.configuration.properties | has("codescene.enableAutoRefactor")' vsix-package.json > /dev/null; then
            echo "ACE setting codescene.enableAutoRefactor found in no-ACE VSIX package.json"
            exit 1
          fi
          if jq -e '.contributes.configuration.properties | has("codescene.authToken")' vsix-package.json > /dev/null; then
            echo "ACE setting codescene.authToken found in no-ACE VSIX package.json"
            exit 1
          fi
          echo "No ACE settings in no-ACE VSIX package.json"

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@v7
        with:
          path: '${{ matrix.vsix_prefix }}-*-${{ matrix.platform }}-${{ matrix.arch }}.vsix'
          name: '${{ matrix.vsix_prefix }}-${{ matrix.platform }}-${{ matrix.arch }}'

  create-release:
    name: 'Create Release'
    runs-on: 'ubuntu-latest'
    needs: metadata
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          IS_TEST: ${{ needs.metadata.outputs.is_test }}
          NOTES_START_TAG: ${{ needs.metadata.outputs.notes_start_tag }}
          STABLE_TAG: ${{ needs.metadata.outputs.stable_tag }}
          TAG: ${{ needs.metadata.outputs.tag }}
        run: |
          set -euo pipefail

          notes_file="${RUNNER_TEMP}/release-notes.md"
          notes_args=(-f tag_name="$TAG")
          if [[ -n "$NOTES_START_TAG" ]]; then
            notes_args+=(-f previous_tag_name="$NOTES_START_TAG")
          fi
          gh api -X POST "repos/${GITHUB_REPOSITORY}/releases/generate-notes" "${notes_args[@]}" --jq .body |
            node ./scripts/release-flow.js compose-notes "$IS_TEST" "$STABLE_TAG" "$TAG" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" \
              > "$notes_file"

          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "Release $TAG already exists, updating its title and notes."
            edit_args=("$TAG" --title "$TAG" --notes-file "$notes_file")
            if [[ "$IS_TEST" == "true" ]]; then
              edit_args+=(--prerelease --latest=false)
            else
              latest_error="${RUNNER_TEMP}/latest-error.txt"
              if latest_tag=$(gh api "repos/${GITHUB_REPOSITORY}/releases/latest" --jq .tag_name 2> "$latest_error"); then
                :
              elif grep -q "HTTP 404" "$latest_error"; then
                latest_tag=
              else
                cat "$latest_error" >&2
                exit 1
              fi
              if [[ "$latest_tag" == "$TAG" ]]; then
                edit_args+=(--latest)
              else
                edit_args+=(--latest=false)
              fi
            fi
            gh release edit "${edit_args[@]}"
          else
            echo "Release $TAG does not exist, creating it."
            create_args=("$TAG" --title "$TAG" --notes-file "$notes_file" --verify-tag --latest=false)
            if [[ "$IS_TEST" == "true" ]]; then
              create_args+=(--prerelease)
            fi
            gh release create "${create_args[@]}"
          fi

  upload:
    name: 'Upload Release Assets'
    runs-on: 'ubuntu-latest'
    needs: [metadata, create-release, build]
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download all VSIX artifacts
        uses: actions/download-artifact@v8
        with:
          path: ./artifacts

      - name: Upload missing assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.metadata.outputs.tag }}
          VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          set -euo pipefail

          vsix_list=$(node ./scripts/release-flow.js vsix-files "$VERSION" all ./artifacts)
          mapfile -t vsix_files <<< "$vsix_list"

          existing_assets="${RUNNER_TEMP}/existing-assets.txt"
          gh release view "$TAG" --json assets --jq '.assets[].name' > "$existing_assets"

          missing_list=$(node ./scripts/release-flow.js missing-assets "$existing_assets" "${vsix_files[@]}")
          if [[ -z "$missing_list" ]]; then
            echo "All assets are already attached to $TAG, nothing to upload."
            exit 0
          fi
          mapfile -t upload_files <<< "$missing_list"
          gh release upload "$TAG" "${upload_files[@]}"

  test-gate:
    name: 'Verify Tests Passed'
    runs-on: 'ubuntu-latest'
    needs: [metadata, upload]
    if: needs.metadata.outputs.is_test == 'false'
    permissions:
      contents: read
      actions: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Require a successful test run for the tagged commit
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ needs.metadata.outputs.sha }}
        run: |
          set -euo pipefail

          gh api "repos/$GITHUB_REPOSITORY/actions/workflows/test.yml/runs?head_sha=$SHA&per_page=100" \
            --jq '[.workflow_runs[] | {status, conclusion, event, html_url}]' |
            node ./scripts/release-flow.js test-gate "$SHA"

  publish:
    name: 'Publish Extension'
    runs-on: 'ubuntu-latest'
    needs: [metadata, build, test-gate]
    if: needs.metadata.outputs.is_test == 'false'
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Download all VSIX artifacts
        uses: actions/download-artifact@v8
        with:
          path: ./artifacts

      - name: Resolve VSIX files
        env:
          VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          set -euo pipefail

          node ./scripts/release-flow.js vsix-files "$VERSION" full ./artifacts > "${RUNNER_TEMP}/full-vsix.txt"
          node ./scripts/release-flow.js vsix-files "$VERSION" noace ./artifacts > "${RUNNER_TEMP}/noace-vsix.txt"

      - name: Azure login (OIDC)
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_MARKETPLACE_PUBLISHING_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_MARKETPLACE_PUBLISHING_TENANT_ID }}
          allow-no-subscriptions: true

      - name: Install publishing tools and verify Marketplace publish rights
        run: |
          set -euo pipefail

          npm install -g @vscode/vsce@4.0.0 ovsx
          vsce verify-pat --azure-credential CodeScene

      - name: Publish full variant to VS Code Marketplace
        run: |
          set -euo pipefail

          mapfile -t full_files < "${RUNNER_TEMP}/full-vsix.txt"
          node ./scripts/release-flow.js publish-marketplace "${full_files[@]}"

      - name: Publish to Open VSX
        env:
          OVSX_PAT: ${{ secrets.OPEN_VSX_PUBLISHING_TOKEN }}
        run: |
          set -euo pipefail

          mapfile -t full_files < "${RUNNER_TEMP}/full-vsix.txt"
          mapfile -t noace_files < "${RUNNER_TEMP}/noace-vsix.txt"
          for file in "${full_files[@]}" "${noace_files[@]}"; do
            echo "Publishing ${file} to Open VSX"
            ovsx publish --skip-duplicate --packagePath "$file"
          done

  record-version:
    name: 'Record Released Version'
    runs-on: 'ubuntu-latest'
    needs: [metadata, publish]
    if: needs.metadata.outputs.is_test == 'false'
    permissions:
      contents: write

    steps:
      - name: Checkout main
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Record the released version on main
        env:
          VERSION: ${{ needs.metadata.outputs.version }}
        run: node ./scripts/release-flow.js record-version "$VERSION"

  promote:
    name: 'Mark Release Latest'
    runs-on: 'ubuntu-latest'
    needs: [metadata, publish, record-version]
    if: needs.metadata.outputs.is_test == 'false'
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Mark the release latest unless a newer release already is
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.metadata.outputs.tag }}
        run: |
          set -euo pipefail

          latest_error="${RUNNER_TEMP}/latest-error.txt"
          if latest_tag=$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name 2> "$latest_error"); then
            :
          elif grep -q "HTTP 404" "$latest_error"; then
            latest_tag=
          else
            cat "$latest_error" >&2
            exit 1
          fi

          action=$(node ./scripts/release-flow.js promotion "$TAG" "$latest_tag")
          case "$action" in
            promote)
              gh release edit "$TAG" --latest
              echo "Marked $TAG as latest."
              ;;
            unchanged)
              echo "$TAG is already latest."
              ;;
            superseded)
              echo "$TAG is older than latest $latest_tag; leaving it not latest."
              ;;
            *)
              echo "Unexpected promotion action: $action" >&2
              exit 1
              ;;
          esac
