name: Run tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  commitlint:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
    - name: Checkout
      uses: actions/checkout@v7
      with:
        # Github performs shallow clones by defaults - prevent that:
        fetch-depth: 0

    - uses: './.github/actions/setup'

    - name: Validate PR commits
      run: npx commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }} --verbose

  build:
    strategy:
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
    - name: Checkout
      uses: actions/checkout@v7
      with:
        fetch-depth: ${{ matrix.os == 'ubuntu-latest' && github.event_name == 'pull_request' && '0' || '1' }}

    - uses: './.github/actions/setup'

    # silence a warning when running tests
    - name: Configure Git
      run: git config --global advice.defaultBranchName false

    - run: npm run pretest
      env:
        CI: true

    - name: Run tests
      if: matrix.os != 'ubuntu-latest' || github.event_name != 'pull_request'
      run: npm test
      env:
        CI: true

    - name: Run tests with coverage
      if: matrix.os == 'ubuntu-latest' && github.event_name == 'pull_request'
      run: npm run test:coverage:dual
      env:
        CI: true

    - name: Check coverage
      if: success() && matrix.os == 'ubuntu-latest' && github.event_name == 'pull_request'
      uses: ./.github/actions/check-coverage
      with:
        access-token: ${{ secrets.CODESCENE_CODE_COVERAGE_API_TOKEN }}
        project-url: https://api.codescene.io/v2/projects/36131
        coverage-files: coverage/lcov.info

  test-no-ace:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v7

    - uses: './.github/actions/setup'

    - name: Configure Git
      run: git config --global advice.defaultBranchName false

    - run: npm run pretest
      env:
        CI: true
        BUILD_NO_ACE: true

    - run: npm test
      env:
        CI: true
        BUILD_NO_ACE: true
