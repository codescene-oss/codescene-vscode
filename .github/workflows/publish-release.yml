name: Publish latest release (manual)

on:
  workflow_dispatch:
    inputs:
      publish_vscode_marketplace:
        type: boolean
        default: true
        description: Publish full variant to VS Code Marketplace
      publish_open_vsx:
        type: boolean
        default: true
        description: Publish to Open VSX
      dry_run:
        type: boolean
        default: false
        description: Verify release assets and Marketplace publish rights without publishing

permissions:
  contents: read
  id-token: write

jobs:
  build:
    name: 'Publish Extension'
    runs-on: 'ubuntu-latest'

    steps:
      - name: Get latest release
        uses: dsaltares/fetch-gh-release-asset@master
        with:
          regex: true
          file: 'codescene-vscode.*\.vsix'
          version: 'latest'
          target: './'
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify platform-specific VSIX files
        run: |
          set -euo pipefail
          rm -f vsix-map.txt noace-vsix-map.txt
          targets=("win32-x64" "darwin-x64" "darwin-arm64" "linux-x64" "linux-arm64")
          for target in "${targets[@]}"; do
            file=$(find . -name "codescene-vscode-*-${target}.vsix" ! -name "codescene-vscode-noace-*" | head -1)
            if [ -z "$file" ]; then
              echo "❌ Missing full-variant VSIX for ${target}"
              exit 1
            fi
            echo "${target}=${file}" >> vsix-map.txt
            echo "✅ Found full variant ${file}"

            noace_file=$(find . -name "codescene-vscode-noace-*-${target}.vsix" | head -1)
            if [ -z "$noace_file" ]; then
              echo "❌ Missing no-ACE VSIX for ${target}"
              exit 1
            fi
            echo "${target}=${noace_file}" >> noace-vsix-map.txt
            echo "✅ Found no-ACE variant ${noace_file}"
          done

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Azure login (OIDC)
        if: ${{ github.event.inputs.publish_vscode_marketplace == 'true' }}
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_PUBLISHING_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_PUBLISHING_TENANT_ID }}
          allow-no-subscriptions: true

      - name: Verify VS Code Marketplace publish rights
        if: ${{ github.event.inputs.publish_vscode_marketplace == 'true' }}
        run: |
          npm install -g @vscode/vsce@4.0.0
          vsce verify-pat --azure-credential CodeScene

      - name: Publish full variant to VS Code Marketplace
        if: ${{ github.event.inputs.publish_vscode_marketplace == 'true' && github.event.inputs.dry_run != 'true' }}
        run: |
          declare -A vsix_map
          while IFS='=' read -r target file; do
            vsix_map["$target"]="$file"
          done < vsix-map.txt
          for target in "${!vsix_map[@]}"; do
            echo "🚀 Publishing ${vsix_map[$target]} to Marketplace (target=${target})"
            vsce publish --azure-credential --packagePath "${vsix_map[$target]}"
          done

      - name: Publish to open-vsx
        if: ${{ github.event.inputs.publish_open_vsx == 'true' && github.event.inputs.dry_run != 'true' }}
        run: |
          npm install -g ovsx
          while IFS='=' read -r target file; do
            echo "🚀 Publishing full variant ${file} to Open VSX (target=${target})"
            ovsx publish --pat ${{ secrets.OPEN_VSX_PUBLISHING_TOKEN }} --packagePath "${file}"
          done < vsix-map.txt
          while IFS='=' read -r target file; do
            echo "🚀 Publishing no-ACE variant ${file} to Open VSX (target=${target})"
            ovsx publish --pat ${{ secrets.OPEN_VSX_PUBLISHING_TOKEN }} --packagePath "${file}"
          done < noace-vsix-map.txt
